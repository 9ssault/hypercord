<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hypercord">
  <!--
    The brand tile as reviewable vector, and the geometry `scripts/make-icons.mjs`
    draws procedurally for icon.png / icon.ico / icon.icns. Keep the two in step:
    this file is what a person can read and review, the script is what produces the
    binaries, and the binaries are what ships.

      tile   512x512, margin 2% (10.24), corner radius 22% (112.64)
      rim    1px-equivalent 3.6 at this scale, so a black tile still reads as a
             tile on a black page - without it the logo disappears
      mark   white on black on purpose: a black mark on a black tile is invisible
      H      box 46% x 47% of the tile, centred; stems and bar 12.5%
  -->
  <rect x="10.24" y="10.24" width="491.52" height="491.52" rx="112.64" fill="#000000" stroke="#2a2c34" stroke-width="3.6"/>
  <g fill="#ffffff">
    <rect x="138.24" y="135.68" width="29.44" height="240.64"/>
    <rect x="344.32" y="135.68" width="29.44" height="240.64"/>
    <rect x="138.24" y="240.96" width="235.52" height="30.08"/>
  </g>
</svg>
