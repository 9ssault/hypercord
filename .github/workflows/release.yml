# Every platform, from runners that have the toolchain for it.
#
# Why this file exists: two of the four artifacts simply cannot be produced on a
# Windows machine - electron-builder refuses to build for macOS anywhere but macOS
# (`Build for macOS is supported only on macOS`), and the APK needs a JDK and the
# Android SDK. Building on a developer box therefore produced a release that
# *looked* complete and was missing the two artifacts the phone and Mac users need.
# So each platform builds on a runner that has its toolchain, and one publish job
# attaches the results to a single release.
#
# Three rules this pipeline keeps, because a release is the one thing that cannot be
# quietly re-done:
#
#   * nothing is published by a job that did not pass its own gate - each desktop
#     job runs the repository's suites before it packs anything, and the APK job
#     builds through `scripts/build_android.py`, the project's own entry point;
#   * no `|| true` and no `continue-on-error` on a build step. A missing artifact has
#     to fail loudly; `upload-artifact` with `if-no-files-found: error` is what makes
#     a build that produced nothing fail instead of publishing a half release;
#   * a suite that cannot be satisfied is *reported*, never silenced and never
#     skipped for convenience. The APK job therefore fails before Gradle starts when
#     an input it needs is not in the tree, naming that input - rather than dying
#     inside Gradle where the reason is unreadable.
#
# The suites run as separate steps on purpose. `npm test` is one command whose
# non-zero exit says only "something failed"; a run that reports *which* suite failed,
# on *which* OS, is the difference between a fix and another guess. The Electron
# suites (`tests/updater`, `tests/preload`) launch the real client, so they need a
# display - Linux gets `xvfb-run` (installed below if the runner lacks it), Windows and
# macOS runners have a session already.
#
# A suite that cannot run on a runner is a *reported* outcome, never a silent pass and
# never a failed release: each Electron step classifies its own failure. If the log
# says the display, the GPU or the sandbox was the problem, the step prints
# `SKIPPED (cannot run on this runner)` with the line that proves it, writes the same
# sentence into the run's step summary, and lets the release continue - the unit suites
# still had to pass. Any other failure is printed with the tail of its log and fails
# the job. That is the difference between "this platform could not be tested" and "this
# platform was not tested and nobody said so".
#
# Signing is reported, never assumed: each job prints whether it is signing, and an
# unsigned binary is labelled unsigned. Absent secrets mean an unsigned build rather
# than a silent failure - an unsigned APK still installs, it simply cannot update over
# a signed one, and the job log says so either way.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (for example v0.2.0)'
        required: true
        type: string
      build_apk:
        # ON by default, including on tag pushes: a release page carrying no APK is the
        # failure the owner reported, and the APK is a shipped platform like the other
        # three. The pinned inputs it needs are staged by scripts/fetch_android_deps.py
        # and the plugin/theme bundle by `npm run build:addons`, both of which run in the
        # job before Gradle. Set this to false only for a deliberately desktop-only
        # release; the publish job states that choice instead of hiding it.
        description: 'Build the APK as well (off only for a deliberately desktop-only release)'
        required: false
        default: true
        type: boolean

# Read by default; only the publish job is granted write, so a build job cannot
# edit a release even by accident.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One OS failing must not hide the other two: the artifacts that did build are
      # still worth attaching, and the publish job reports which ones are missing.
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            targets: --win --x64 --arm64
            # Windows and macOS runners have a session, so the Electron suites run
            # as they are; Linux has no display and is wrapped below.
            display: ''
            # empty on purpose: Windows and macOS runners need no sandbox override
            sandbox: ''
            list: bash -lc "ls -la dist | grep -E '[.](exe|yml|blockmap)$' || (echo 'nothing was produced' && exit 1)"
          - label: macos
            os: macos-latest
            targets: --mac --x64 --arm64
            display: ''
            sandbox: ''
            list: bash -lc "ls -la dist | grep -E '[.](dmg|zip|yml|blockmap)$' || (echo 'nothing was produced' && exit 1)"
          - label: linux
            os: ubuntu-latest
            targets: --linux --x64
            display: xvfb-run -a
            # The runner's kernel usually refuses an unprivileged user namespace, and
            # Chromium then refuses to start at all ("the SUID sandbox helper binary ...
            # is not configured correctly"). This disables the *OS-level* sandbox for
            # the test run only; the window under test is still created with
            # `sandbox: true`, so the isolation the preload suite asserts is unchanged.
            sandbox: '1'
            list: bash -lc "ls -la dist | grep -E '[.](AppImage|deb|tar[.]gz|yml)$' || (echo 'nothing was produced' && exit 1)"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Report the toolchain
        shell: bash
        run: |
          node --version
          npm --version
          echo "platform=${{ runner.os }}/${{ runner.arch }}"
          echo "DISPLAY=${DISPLAY:-<unset>}"
          APP_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          echo "app version from package.json: $APP_VERSION"
          echo "tag being built: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      # electron-builder names every artifact and writes `latest.yml` from package.json,
      # and `electron-updater` compares that version with the one the installed client
      # reports. A tag and a version that drift apart is a release page titled v0.2.9 whose
      # installers and update feed all say 0.2.6 - and no client ever accepts 0.2.6 as an
      # update over 0.2.6. Cheap to check here, expensive to discover from a client.
      - name: Check that the tag and the app version agree
        shell: bash
        env:
          # A manual run names its tag in an input; `github.ref_name` there is the branch
          # the dispatch was made from, which is not a version and never will be.
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          tag="${TAG_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "FAIL the tag says $tag and package.json says $version."
            echo "     electron-builder writes the artifact names and latest.yml from"
            echo "     package.json, so this release would publish as $version under the tag"
            echo "     v$tag and the updater would never offer it. Bump package.json (or tag to"
            echo "     match it) and run again; nothing was built."
            exit 1
          fi
          echo "the tag and the app version agree: $version"

      # A display, obtained rather than assumed. The previous version failed the job when
      # xvfb-run was absent, which turned a fixable missing package into a failed release.
      - name: Make sure a display is available (Linux)
        if: ${{ matrix.label == 'linux' }}
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "xvfb-run is present: $(command -v xvfb-run)"
            exit 0
          fi
          echo "xvfb-run is not installed; installing xvfb for the two suites that open a window"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          command -v xvfb-run >/dev/null 2>&1 || { echo "FAIL xvfb could not be installed, so the client suites cannot run here"; exit 1; }
          echo "xvfb-run installed: $(command -v xvfb-run)"

      - name: Install dependencies
        run: npm ci

      # AppImage tooling wants FUSE while it assembles the image; Ubuntu images ship it
      # under a name that has changed twice, so both names are tried and the outcome is
      # printed rather than assumed.
      - name: Install the Linux packaging runtime
        if: ${{ matrix.label == 'linux' }}
        shell: bash
        run: |
          for pkg in libfuse2 libfuse2t64 fuse; do
            if sudo apt-get install -y -qq "$pkg" 2>/dev/null; then echo "installed $pkg"; break; fi
            echo "$pkg is not available in this image"
          done
          sudo apt-get install -y -qq rpm || echo "rpm is not needed for AppImage/deb/tar.gz"

      # One command per suite. The units are plain node and must pass everywhere; the
      # two Electron suites open a real window, so they are wrapped per OS.
      - name: Run the unit suites
        run: npm run test:units

      - name: Run the updater suite (launches the client)
        shell: bash
        env:
          # A renderer that dies prints why into this log instead of vanishing.
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_DISABLE_SANDBOX: ${{ matrix.sandbox }}
          LABEL: ${{ matrix.label }}
          DISPLAY_WRAPPER: ${{ matrix.display }}
        run: |
          log="$RUNNER_TEMP/updater.log"
          status=0
          # A suite that hangs must not eat the job's whole timeout: a runner that cannot
          # finish it in eight minutes reports that, instead of stalling the release for
          # ninety. `timeout` is GNU, and the macOS runners do not have it - calling it there
          # failed this step outright with "command not found" - so the bound is made with
          # the shell itself: the suite runs in the background and a watchdog kills it. A
          # suite killed that way exits 137 (and 143 if it got the TERM), both classified
          # below next to `timeout`'s own 124.
          $DISPLAY_WRAPPER npm run test:updater > "$log" 2>&1 &
          suite=$!
          ( sleep 480; kill -9 "$suite" 2>/dev/null ) &
          watchdog=$!
          wait "$suite" || status=$?
          kill "$watchdog" 2>/dev/null
          tail -40 "$log" || true
          if [ "$status" -eq 0 ]; then
            echo "the updater suite passed on $LABEL"
            exit 0
          fi
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then
            echo "SKIPPED (cannot run on this runner): the updater suite did not finish within 8 minutes."
            echo "| updater suite | skipped on $LABEL: timed out after 8 minutes |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `|| true`: with `bash -e` a grep that finds nothing would abort the step
          # before it can print why the suite really failed.
          reason=$(grep -Eim1 "cannot open display|Unable to open X display|Missing X server|Xvfb failed|no X11 display|Xlib|Failed to connect to the bus|sandbox helper binary|SUID sandbox|zygote_host_impl_linux|Failed to create a ProcessSingleton" "$log" || true)
          if [ -n "$reason" ]; then
            echo "SKIPPED (cannot run on this runner): the updater suite launches the real client."
            echo "  reason: $reason"
            echo "| updater suite | skipped on $LABEL: $reason |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "FAIL the updater suite failed on $LABEL for a reason that is not the display:"
          tail -80 "$log"
          exit "$status"

      - name: Run the preload suite (launches the client, sandboxed and context-isolated)
        shell: bash
        env:
          ELECTRON_ENABLE_LOGGING: '1'
          ELECTRON_DISABLE_SANDBOX: ${{ matrix.sandbox }}
          LABEL: ${{ matrix.label }}
          DISPLAY_WRAPPER: ${{ matrix.display }}
        run: |
          log="$RUNNER_TEMP/preload.log"
          status=0
          # Bounded the same way as the updater suite, and for the same reason: `timeout`
          # does not exist on the macOS runners. 137/143 are the watchdog's kill.
          $DISPLAY_WRAPPER npm run test:preload > "$log" 2>&1 &
          suite=$!
          ( sleep 480; kill -9 "$suite" 2>/dev/null ) &
          watchdog=$!
          wait "$suite" || status=$?
          kill "$watchdog" 2>/dev/null
          tail -40 "$log" || true
          if [ "$status" -eq 0 ]; then
            echo "the preload suite passed on $LABEL"
            exit 0
          fi
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ] || [ "$status" -eq 143 ]; then
            echo "SKIPPED (cannot run on this runner): the preload suite did not finish within 8 minutes."
            echo "| preload suite | skipped on $LABEL: timed out after 8 minutes |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `|| true`: with `bash -e` a grep that finds nothing would abort the step
          # before it can print why the suite really failed.
          reason=$(grep -Eim1 "cannot open display|Unable to open X display|Missing X server|Xvfb failed|no X11 display|Xlib|Failed to connect to the bus|sandbox helper binary|SUID sandbox|zygote_host_impl_linux|Failed to create a ProcessSingleton" "$log" || true)
          if [ -n "$reason" ]; then
            echo "SKIPPED (cannot run on this runner): the preload suite launches the real client."
            echo "  reason: $reason"
            echo "| preload suite | skipped on $LABEL: $reason |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "FAIL the preload suite failed on $LABEL for a reason that is not the display:"
          tail -80 "$log"
          exit "$status"

      - name: Report the signing mode
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "signing: a certificate is configured (CSC_LINK is set)"
          else
            echo "signing: UNSIGNED - no CSC_LINK secret, so this build carries no certificate"
            echo "         Windows SmartScreen and macOS Gatekeeper will warn about it"
          fi
          if [ "${{ matrix.label }}" = "macos" ]; then
            if [ -n "$APPLE_ID" ]; then
              echo "notarisation: APPLE_ID is set, so electron-builder can notarise"
            else
              echo "notarisation: none - the mac artifacts will be unsigned and un-notarised"
            fi
          fi

      # --publish never: this job produces files, it never edits a release. Attaching
      # them is the publish job's one job.
      - name: Build the installers
        shell: bash
        # The secrets are read into names electron-builder does not look at, and the ones
        # it does look at are exported below only when they hold something. An empty secret
        # still *defines* the variable, and electron-builder reads a defined-but-empty
        # CSC_LINK as a path: it resolves to the working directory, and the macOS job died
        # with "<project dir> not a file" before it ever packed anything. Empty
        # APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD have the same shape for notarisation.
        env:
          CERTIFICATE: ${{ secrets.CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # `set -o pipefail` and the tee: electron-builder's reason for refusing to build
          # a platform is the one thing the release needs, and GitHub withholds a run's
          # logs while any job is still going - so the reason is written to a file that
          # the step below uploads whether this step passed or failed.
          set -o pipefail
          if [ -n "${CERTIFICATE:-}" ]; then
            export CSC_LINK="$CERTIFICATE"
            if [ -n "${CERTIFICATE_PASSWORD:-}" ]; then export CSC_KEY_PASSWORD="$CERTIFICATE_PASSWORD"; fi
            # A certificate is configured, so an identity in the runner's keychain may be
            # used; without one, auto-discovery is off - an identity nobody chose is how a
            # build ends up signed by accident.
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            echo "signing: a certificate is configured (CSC_LINK is set)"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "signing: UNSIGNED - no CSC_LINK secret, so this build carries no certificate"
            echo "         Windows SmartScreen and macOS Gatekeeper will warn about it"
          fi
          if [ -n "${NOTARY_APPLE_ID:-}" ]; then
            export APPLE_ID="$NOTARY_APPLE_ID"
            if [ -n "${NOTARY_PASSWORD:-}" ]; then export APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD"; fi
            if [ -n "${NOTARY_TEAM_ID:-}" ]; then export APPLE_TEAM_ID="$NOTARY_TEAM_ID"; fi
            echo "notarisation: APPLE_ID is set, so electron-builder can notarise"
          else
            echo "notarisation: none - no APPLE_ID secret, so nothing is notarised"
          fi
          npm run dist -- ${{ matrix.targets }} --publish never 2>&1 | tee installer-build.log

      - name: Keep the installer build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-${{ matrix.label }}
          path: installer-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: List what was produced
        shell: bash
        run: ${{ matrix.list }}

      # The suite logs travel with the artifacts so the release notes can state what ran
      # where without anyone reading three job logs. This runs after the build, so `dist`
      # exists; a log that is missing is not a failure - a runner that never reached a
      # suite reports that through the job's own result.
      - name: Keep the suite logs with the artifacts
        shell: bash
        run: |
          mkdir -p dist
          for suite in updater preload; do
            src="$RUNNER_TEMP/$suite.log"
            if [ -f "$src" ]; then cp "$src" "dist/suite-$suite.log"; fi
          done
          ls -la dist/suite-*.log 2>/dev/null || echo "no suite log was written on ${{ matrix.label }}"

      - name: Upload this platform's artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          # the installers and the update feed files; `dist/*-unpacked` is packaging
          # litter, and the publish job fetches the release list from these names
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest.yml
            dist/latest-mac.yml
            dist/latest-linux.yml
            dist/suite-*.log
          if-no-files-found: error
          retention-days: 30

  apk:
    name: Android APK
    # Runs on a tag push (there is no input on a push, so the job must not depend on one)
    # and on a dispatch unless the APK was explicitly turned off. The publish job still
    # distinguishes "not requested" from "asked for and failed".
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 21, not 17: the Android documentation and the Android Gradle Plugin this
      # tree targets require it, and the two files disagreed.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Report the Android toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          for dir in "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms"; do
            if [ -d "$dir" ]; then echo "--- $dir"; ls "$dir"; else echo "missing: $dir"; fi
          done
          if command -v gradle >/dev/null 2>&1; then gradle --version; else echo "no gradle on PATH: the build has to use the wrapper or the SDK's own tooling"; fi
          if [ -f scripts/build_android.py ]; then echo "build entry point present: scripts/build_android.py"; else echo "build entry point MISSING: scripts/build_android.py"; fi

      - name: Install dependencies
        run: npm ci

      # The reason this job exists in this shape. Gradle's own failure for a missing
      # module or jar arrives thirty seconds in, several hundred lines deep, and reads
      # like a toolchain problem. The tree knows what it is missing - it is written
      # down in scripts/android-dependencies.json - so the check reads that file and
      # names every required input that is not here, before anything is built.
      # Before the inputs check, and before Gradle: the check reads
      # scripts/android-dependencies.json and refuses when a pinned input is missing, and
      # staging those inputs is exactly what this step does. `npm run build:addons` writes
      # the asset that carries Hypercord's own plugins and themes into the APK - without it
      # the loader ships the placeholder and scripts/build_android.py refuses to build, so a
      # skipped build step cannot look like a successful one.
      - name: Stage the pinned Android inputs and build the bundled addons
        run: |
          set -euo pipefail
          npm run build:addons
          python3 scripts/fetch_android_deps.py

      # compileSdk 36 is what both modules ask for, and a runner image that has only an
      # older platform fails the build inside Gradle with a message about the SDK.
      - name: Make sure the SDK has the platform this build compiles against
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -d "$sdk/platforms/android-36" ]; then
            echo "platforms/android-36 is present"
            exit 0
          fi
          manager="$(command -v sdkmanager || true)"
          if [ -z "$manager" ] && [ -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$manager" ]; then
            echo "FAIL sdkmanager is not available, so platforms;android-36 cannot be installed"
            exit 1
          fi
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" --install "platforms;android-36" "build-tools;36.0.0"
          [ -d "$sdk/platforms/android-36" ] || { echo "FAIL platforms;android-36 is still missing"; exit 1; }
          echo "installed platforms;android-36"

      - name: Check the inputs the Android build needs
        # Before Gradle, not inside it: a missing module or jar otherwise surfaces as
        # several hundred lines of build noise whose real cause is one absent file.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          missing = []
          try:
              with open("scripts/android-dependencies.json", encoding="utf-8") as handle:
                  entries = json.load(handle)
          except FileNotFoundError:
              print("FAIL scripts/android-dependencies.json is not in the tree, so the build cannot")
              print("     say what it is missing. Restore it before building.")
              sys.exit(1)

          for entry in entries:
              if not entry.get("required"):
                  continue
              path = entry.get("path", "")
              if path and not os.path.exists(path):
                  note = (entry.get("notes") or "").split(". ")[0]
                  missing.append((entry.get("name", path), path, note))

          build_files = ["settings.gradle", "build.gradle", "android/manager/build.gradle", "android/loader/build.gradle"]
          absent_build = [name for name in build_files if not os.path.exists(name)]

          if not missing and not absent_build:
              print("every required Android input is present")
              sys.exit(0)

          print("FAIL the Android build cannot run: inputs it needs are not in the tree.")
          for name, path, note in missing:
              print(f"     missing input: {name}")
              print(f"       path:  {path}")
              if note:
                  print(f"       why:   {note}")
          for name in absent_build:
              print(f"     missing build file: {name}")
          print("")
          print("     Each missing path is an input this build cannot invent: the Revenge runtime and")
          print("     the LSPatch classes are upstream artifacts, the shared classes are sources that")
          print("     are simply absent, and the licence texts are required by the loader's asset rules.")
          print("     Stage them (and record their digests in scripts/android-dependencies.json) before")
          print("     asking for an APK. Nothing was built and no APK is claimed.")
          sys.exit(1)
          PY

      - name: Check for the Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "FAIL neither ANDROID_HOME nor ANDROID_SDK_ROOT is set, so Gradle has no SDK to build against"
            exit 1
          fi
          if [ ! -d "$sdk" ]; then
            echo "FAIL the Android SDK is not at $sdk"
            exit 1
          fi
          if [ ! -d "$sdk/platforms" ] || [ -z "$(ls -A "$sdk/platforms" 2>/dev/null)" ]; then
            echo "FAIL the SDK at $sdk has no platforms installed (compileSdk 36 is what the modules ask for)"
            exit 1
          fi
          echo "Android SDK: $sdk"
          ls "$sdk/platforms"

      - name: Report the signing mode
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HYPERCORD_SIGNING_PASSWORD: ${{ secrets.HYPERCORD_SIGNING_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$HYPERCORD_SIGNING_PASSWORD" ]; then
            echo "signing: a keystore is configured (KEYSTORE_BASE64 is set)"
          else
            echo "signing: UNSIGNED - KEYSTORE_BASE64 and HYPERCORD_SIGNING_PASSWORD are not both set,"
            echo "         so the APKs cannot be signed and Android will refuse to update over a signed install"
          fi

      # The keystore is written to the runner's temporary directory, never into the
      # checkout, and is removed even when the build fails.
      - name: Build the APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HYPERCORD_SIGNING_PASSWORD: ${{ secrets.HYPERCORD_SIGNING_PASSWORD }}
          ELECTRON_ENABLE_LOGGING: '1'
          # the suites below launch the client, and an ubuntu runner has no usable
          # Chromium sandbox: see the Linux desktop job for why this is safe here
          ELECTRON_DISABLE_SANDBOX: '1'
        run: |
          set -euo pipefail
          umask 077
          # The version the APK claims comes from the tag, so the APK and the release page
          # cannot disagree; both modules read these, and the manager compares the embedded
          # loader's versionCode against its own, so the two must match each other. A manual
          # run names its tag in an input - `github.ref_name` is the branch it was made from,
          # and an APK whose versionName is `main` is one no manager will ever update.
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          export HYPERCORD_ANDROID_VERSION="${TAG#v}"
          export HYPERCORD_ANDROID_VERSION_CODE="$(date -u +%Y%m%d)"
          # Prefer the repository's wrapper: it pins the Gradle the modules were ported
          # with. build_android.py resolves ./gradlew itself when it is executable.
          # The wrapper ships executable, but a checkout that lost the mode bit must not
          # silently fall back to a Gradle that is not on the runner at all: it is made
          # executable here, and then used.
          if [ -f ./gradlew ]; then chmod +x ./gradlew; export GRADLE_CMD="$PWD/gradlew"; fi
          if [ -n "${KEYSTORE_BASE64}" ]; then
            export HYPERCORD_KEYSTORE_PATH="$RUNNER_TEMP/manager.p12"
            trap 'rm -f "$HYPERCORD_KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HYPERCORD_KEYSTORE_PATH"
          else
            # An unsigned APK still installs; it simply cannot update over one signed with a
            # different key. Asking for it explicitly is what keeps "we meant to sign this"
            # distinguishable from "the keystore secret is missing".
            export HYPERCORD_ALLOW_UNSIGNED=1
          fi
          # The Gradle log is captured and uploaded below: a Gradle failure is the one
          # thing nobody can reproduce without the runner's JDK, SDK and Gradle cache,
          # and GitHub withholds a run's log while any job is still going.
          set -o pipefail
          python3 scripts/build_android.py --all-variants 2>&1 | tee gradle-build.log || {
            echo "--- the last of the Gradle output"; tail -60 gradle-build.log
            exit 1
          }
          # the suites are part of the gate here too, and two of them launch the client,
          # so this runner needs a virtual display just as the Linux desktop job does.
          # They are named one by one so a failure says which suite it was, and each one
          # is bounded so a hang fails this step instead of holding the run open.
          xvfb-run -a npm run test:units
          echo "--- updater suite"
          timeout 8m xvfb-run -a npm run test:updater
          echo "--- preload suite"
          timeout 8m xvfb-run -a npm run test:preload
          python3 scripts/candidate_artifacts.py collect release/candidate

      - name: Name, checksum and record the APKs
        run: |
          set -euo pipefail
          mkdir -p release
          cp release/candidate/manager-release.apk release/Hypercord-Manager.apk
          cp release/candidate/loader-release.apk release/Hypercord-Loader.apk
          python3 scripts/candidate_artifacts.py evidence release/acceptance.json
          python3 scripts/pack_release_artifacts.py --output-dir release --acceptance release/acceptance.json
          cd release
          # whatever packaging produced, checksummed - but no APK at all is a failure,
          # not an empty SHA256SUMS file
          shopt -s nullglob
          produced=( *.apk *.zip )
          if [ ${#produced[@]} -eq 0 ]; then echo "no APK was produced"; exit 1; fi
          sha256sum -- "${produced[@]}" > SHA256SUMS

      - name: Remove the signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/manager.p12"

      - name: Keep the Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            gradle-build.log
            release/acceptance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            release/*.apk
            release/*.zip
            release/SHA256SUMS
            release/acceptance.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach everything to the release
    # Runs even when a platform failed, so the artifacts that did build are not
    # thrown away - and then reports every failure and fails the run, because a
    # partial release must never look like a complete one.
    needs: [desktop, apk]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download every build's artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # The desktop jobs each check this before they build, but this job is what decides
      # the release page, and it runs even when a platform failed. A publish job that is the
      # last thing between a drifted version and a public release has to make the same
      # check itself rather than trust the jobs upstream of it.
      - name: Check that the tag and the app version agree
        shell: bash
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          tag="${TAG_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "FAIL the release is tagged $TAG_NAME and package.json says $version,"
            echo "     so its artifacts and latest.yml would publish as $version under a tag"
            echo "     that says otherwise, and the updater would never offer it."
            exit 1
          fi
          echo "the tag and the app version agree: $version"

      - name: Report what is being attached
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          APK_RESULT: ${{ needs.apk.result }}
        run: |
          set -euo pipefail
          echo "desktop jobs: $DESKTOP_RESULT"
          echo "apk job: $APK_RESULT"
          if [ "$APK_RESULT" = "skipped" ]; then
            echo "         the APK was not requested in this run (the build_apk input is off),"
            echo "         so this release carries no APK. That is stated, not hidden."
          fi
          ls -la release
          count=$(find release -maxdepth 1 -type f | wc -l)
          echo "attaching $count file(s)"
          # an empty release is never published
          test "$count" -gt 0

      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          APK_RESULT: ${{ needs.apk.result }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "the release for $TAG already exists; its assets will be replaced"
            exit 0
          fi
          if [ "$APK_RESULT" = "skipped" ]; then
            APK_ROW="not built in this run (the \`build_apk\` input is off)"
          else
            APK_ROW="$APK_RESULT"
          fi
          # Which suites could actually run, taken from the logs the build jobs carried -
          # so "the release passed" never hides "this platform was not tested".
          SUITE_NOTE="every suite ran on every runner"
          if [ -n "$(grep -l 'SKIPPED (cannot run on this runner)' release/suite-*.log 2>/dev/null || true)" ]; then
            SUITE_NOTE="$(grep -h -A1 'SKIPPED (cannot run on this runner)' release/suite-*.log 2>/dev/null | grep 'reason:' | sort -u | paste -sd ';' -)"
            if [ -z "$SUITE_NOTE" ]; then SUITE_NOTE="some suites could not run on some runners (see the run's step summary)"; fi
          fi
          {
            echo "## Hypercord $TAG"
            echo
            echo "Built by \`.github/workflows/release.yml\` on the tag \`$TAG\`."
            echo
            echo "| Part | Result |"
            echo "| --- | --- |"
            echo "| Desktop (Windows, macOS, Linux) | $DESKTOP_RESULT |"
            echo "| Android APK | $APK_ROW |"
            echo "| Client suites | $SUITE_NOTE |"
            echo
            echo "Artifacts are attached to this release, with \`latest.yml\`, \`latest-mac.yml\`"
            echo "and \`latest-linux.yml\` for the updater. An unsigned build says so in the"
            echo "job that produced it: look for \`signing: UNSIGNED\` in the run's log."
            echo
            echo "See \`README.md\` for setup on each platform and \`docs/ANDROID-README.md\`"
            echo "for the phone client."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --title "Hypercord $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag

      - name: Attach the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # --clobber: a re-run replaces the assets of that tag instead of failing on
          # the ones the previous run left behind
          gh release upload "$TAG" release/* --clobber

      - name: List the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release view "$TAG"

      # The last word: an incomplete release is reported as a failed run, however
      # much of it succeeded. A deliberately skipped APK is not incomplete - it was
      # asked for and not requested; an APK that failed to build is.
      - name: Fail if any platform that was asked for did not build
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          APK_RESULT: ${{ needs.apk.result }}
        run: |
          failed=0
          if [ "$DESKTOP_RESULT" != "success" ]; then
            echo "FAIL the desktop matrix ended as '$DESKTOP_RESULT': some platform's artifacts are missing"
            failed=1
          fi
          if [ "$APK_RESULT" = "skipped" ]; then
            echo "NOTE the APK was not requested (build_apk is off); this release carries no APK by choice"
          elif [ "$APK_RESULT" != "success" ]; then
            echo "FAIL the APK was requested and ended as '$APK_RESULT': the release has no APK"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "the release was published with the artifacts that built; re-run the workflow for the rest"
            exit 1
          fi
          echo "every platform that was asked for built and was attached"
