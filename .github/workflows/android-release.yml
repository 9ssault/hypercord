name: Android candidate and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing source tag; must match package.json'
        required: true
        default: 'v2.12.0'
        type: string
      candidate_run_id:
        description: 'Accepted candidate workflow run ID; leave empty to build a candidate'
        required: false
        type: string
      acceptance_url:
        description: 'HTTPS acceptance JSON in this repository release assets (required for publication)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # 21: the Android documentation and the Android Gradle Plugin this tree
          # targets require it, and the two files disagreed
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      # The generated assets are checked against their sources *before* Gradle runs, because
      # a stale one does not fail anything later: 0.3.16's loader shipped a 142,443-byte
      # `assets/addons.js` while the tree's bundle was 143,313 bytes, so the APK carried an
      # older JavaScript half than the release it was named after and nothing said so.
      - name: Verify generated assets
        run: |
          set -euo pipefail
          npm run build:addons:check
          npm run build:runtime:check

      - name: Build candidate
        if: ${{ inputs.candidate_run_id == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HYPERCORD_SIGNING_PASSWORD: ${{ secrets.HYPERCORD_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          # An APK with no signature block is not installable at all: Android answers
          # `INSTALL_PARSE_FAILED_NO_CERTIFICATES`, so the "unsigned is better than no
          # APK" this branch used to assume was never true - the loader that shipped in
          # 0.3.16 had no `META-INF/*.RSA` and could not be installed on a phone. A build
          # with no configured keystore therefore signs with a generated release key
          # (self-signed, 30 years) and says which one it used. The mode is stated either
          # way, and the job verifies the signature afterwards, so nobody has to take the
          # log's word for it.
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$HYPERCORD_SIGNING_PASSWORD" ]; then
            echo "signing: a keystore is configured (KEYSTORE_BASE64 is set)"
            export HYPERCORD_KEYSTORE_PATH="$RUNNER_TEMP/manager.p12"
            trap 'rm -f "$HYPERCORD_KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HYPERCORD_KEYSTORE_PATH"
          else
            echo "signing: no keystore secret - signing with a generated release key"
            echo "         (KEYSTORE_BASE64/HYPERCORD_SIGNING_PASSWORD unset; an install only"
            echo "          updates across releases while the same key is used, so store both"
            echo "          secrets for a key that survives a rebuild)"
            export HYPERCORD_KEYSTORE_PATH="$RUNNER_TEMP/generated.p12"
            export HYPERCORD_SIGNING_PASSWORD="$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 32)"
            trap 'rm -f "$HYPERCORD_KEYSTORE_PATH"' EXIT
            keytool -genkeypair -keystore "$HYPERCORD_KEYSTORE_PATH" -storetype PKCS12 \
              -alias hypercord -keyalg RSA -keysize 4096 -validity 10950 \
              -dname "CN=Hypercord, O=Hypercord, C=US" \
              -storepass "$HYPERCORD_SIGNING_PASSWORD" -keypass "$HYPERCORD_SIGNING_PASSWORD" >/dev/null 2>&1
          fi
          python3 scripts/build_android.py --all-variants
          # The size budget is a gate, not a report: the APKs that were just built are
          # measured against `scripts/size-budget.json` and a release over it stops here,
          # while the number is written down either way.
          node scripts/check-size.mjs --output release/size.json
          # xvfb, because two of the suites launch the real client in a window and this
          # runner has no display: without it they fail for the display, not the code
          xvfb-run -a npm test
          # no `npm run build` here: package.json has no such script (the addon bundle is
          # assembled by the Android build itself), and a missing script failed this step
          python3 scripts/candidate_artifacts.py collect release/candidate

      - name: Upload candidate artifact
        if: ${{ inputs.candidate_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hypercord-candidate
          path: release/candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Retrieve accepted candidate without rebuilding
        if: ${{ inputs.candidate_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: Hypercord-candidate
          path: release/candidate/
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify source, accepted bytes and package release
        if: ${{ inputs.candidate_run_id != '' }}
        env:
          ACCEPTANCE_URL: ${{ inputs.acceptance_url }}
        run: |
          set -euo pipefail
          test -n "$ACCEPTANCE_URL"
          python3 scripts/candidate_artifacts.py restore release/candidate
          python3 scripts/candidate_artifacts.py evidence release/acceptance.json
          python3 scripts/pack_release_artifacts.py --output-dir release --acceptance release/acceptance.json
          cp release/candidate/manager-release.apk release/Hypercord-Manager.apk
          cp release/candidate/loader-release.apk release/Hypercord-Loader.apk
          cd release
          sha256sum -- *.apk *.zip > SHA256SUMS

      - name: Publish accepted GitHub release
        if: ${{ inputs.candidate_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          # named in the notes, so it has to be in this step's environment too
          ACCEPTANCE_URL: ${{ inputs.acceptance_url }}
        run: |
          # the notes are written here rather than read from a file in the tree: the
          # `docs/release-notes.md` this step used to name does not exist, so publishing
          # failed after everything had already been built and verified
          {
            echo "## Hypercord $RELEASE_TAG (Android)"
            echo
            echo "Accepted candidate, built from source at \`$RELEASE_TAG\` and verified before publication."
            echo
            echo "|​ Part | Detail |"
            echo "| --- | --- |"
            echo "| Acceptance record | \`$ACCEPTANCE_URL\` |"
            echo "| Artifacts | \`Hypercord-Manager.apk\`, \`Hypercord-Loader.apk\`, the release zip and \`SHA256SUMS\` |"
            echo
            echo "Both APKs are signed and their signature blocks were verified by the build: \`signature_block\` in the acceptance record names the files."
            echo "See \`docs/ANDROID-README.md\` for installing the Manager and the Loader."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" \
            release/*.apk release/*.zip release/SHA256SUMS release/acceptance.json \
            --verify-tag \
            --title "Hypercord $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/manager.p12" "$RUNNER_TEMP/generated.p12"
