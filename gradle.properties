# language: Properties, file: gradle.properties
#
# Four lines that are about the build, not about the product.
#
# Memory: the manager compiles apkzlib and the manifest editor, and the default heap is
# not enough for either on a small CI runner. Caching and parallelism are on because this
# repository builds the same two modules repeatedly and the machine has more than one
# core; both are safe to turn off on a constrained box.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

# No source in either module imports androidx today - the UI is built from framework
# widgets - but any dependency that pulls it in needs this flag, and a missing flag
# surfaces as a confusing duplicate-class or manifest-merger error rather than a missing
# library, so it is set here rather than discovered later.
android.useAndroidX=true
android.nonTransitiveRClass=true
