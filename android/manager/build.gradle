plugins { id 'com.android.application' }
// Keep the separately injected runtime DEX out of R8's Java program inputs.
def patcherAssets = layout.buildDirectory.dir('generated/patcherAssets')
def unpackPatcher = tasks.register('unpackPatcher', Sync) {
 from(zipTree('../deps/lspatch.jar')) { include 'assets/**'; eachFile { path = path.substring('assets/'.length()) }; includeEmptyDirs = false }
 from('src/main/assets') { exclude 'loader.apk' } // Ignore only the old generated loader.
 from('../licenses')
 into(patcherAssets)
}
def patcherCode = tasks.register('patcherCode', Jar) {
 archiveFileName = 'lspatch-code.jar'
 destinationDirectory = layout.buildDirectory.dir('prepared')
 from(zipTree('../deps/lspatch.jar')) { exclude 'assets/**', 'META-INF/MANIFEST.MF', 'org/lsposed/patch/ApkPatcher.class' }
}
android {
 namespace 'app.assault.manager'
 compileSdk 36
 buildFeatures { buildConfig true }
 sourceSets.main.res.srcDirs += '../branding/res'
 sourceSets.main.java.srcDirs += '../shared/src/main/java'
 defaultConfig { applicationId 'app.assault.manager'; minSdk 28; targetSdk 36; versionCode 211002; versionName '2.11.2' }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_21
  targetCompatibility JavaVersion.VERSION_21
  coreLibraryDesugaringEnabled true
 }
 sourceSets.main.assets.setSrcDirs([unpackPatcher])
 packaging.resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/maven/**', 'META-INF/services/java.security.Provider', 'org/bouncycastle/x509/CertPathReviewerMessages*']
}
dependencies {
 implementation files(patcherCode.flatMap { it.archiveFile })
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
// AGP's generated-source API wires every asset consumer (including lint).
abstract class BundleLoader extends DefaultTask {
 @InputFile abstract RegularFileProperty getLoaderApk()
 @OutputDirectory abstract DirectoryProperty getOutputDirectory()
 @TaskAction void bundle() {
  project.copy {
   from(loaderApk)
   into(outputDirectory)
   rename { 'loader.apk' }
  }
 }
}
androidComponents {
 onVariants(selector().all()) { variant ->
  def bundleLoader = tasks.register("bundle${variant.name.capitalize()}Loader", BundleLoader) {
   dependsOn ":android:loader:assemble${variant.name.capitalize()}"
   loaderApk = project(':android:loader').layout.buildDirectory.file("outputs/apk/${variant.name}/loader-${variant.name}.apk")
   outputDirectory = layout.buildDirectory.dir("generated/loaderAssets/${variant.name}")
  }
  variant.sources.assets.addGeneratedSourceDirectory(bundleLoader) { it.outputDirectory }
 }
}
tasks.named('preBuild').configure { dependsOn unpackPatcher, patcherCode }

apply from: '../signing.gradle'
