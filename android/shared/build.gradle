// language: Groovy, file: android/shared/build.gradle
//
// The one library both apps compile against: the account profile, the presence builder and
// the command guide.
//
// It is a library, not an application, because it has no manifest entry, no launcher and
// nothing to install - it is code the manager shows and the loader imports. Both modules
// need it in their own `dependencies` block (`implementation project(':android:shared')`)
// and it must be declared in the root `settings.gradle` (`include ':android:shared'`);
// without those two lines Gradle reports "package app.assault.shared does not exist" from
// inside the module that imports it, which is a message about the wrong file.
plugins {
    id 'com.android.library'
}

android {
    // The sources are in app.assault.shared, and a library without a namespace gets
    // R and BuildConfig in a package derived from the manifest it does not have.
    namespace 'app.assault.shared'
    compileSdk 36

    defaultConfig {
        // 26 to match both callers: the manager's screens and the loader are API 26+.
        minSdk 26
    }

    buildFeatures {
        // No generated BuildConfig is read here, and every screen is built from framework
        // widgets rather than XML, so there is no layout to bind either.
        buildConfig false
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// No dependencies. `org.json` is part of the platform, the dialogs are framework
// AlertDialogs, and staying dependency-free keeps this module out of both APKs' method
// counts - the reason the manager and the loader can be as small as they are.
