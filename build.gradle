// language: Groovy, file: build.gradle
//
// The root build declares the Android Gradle Plugin once and configures nothing else: each
// module says how it is built, so there is one place to look for a module's settings and one
// place for the tool version.
//
// Version choice, stated because a mismatched AGP/Gradle pair fails before it compiles
// anything: android/loader/build.gradle and android/manager/build.gradle use the AGP
// generated-source API (`variant.sources.assets.addGeneratedSourceDirectory`) and both target
// compileSdk 36, and gradle/wrapper/gradle-wrapper.properties pins Gradle 8.13. AGP 8.11.1 is
// the pairing this tree was ported with (upstream Assault 2.11.2). If the installed SDK has no
// android-36 platform, lower compileSdk and targetSdk in *both* module files together -
// lowering one of them alone changes behaviour silently.
plugins {
    id 'com.android.application' version '8.11.1' apply false
}
