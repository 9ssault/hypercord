// language: Groovy, file: settings.gradle
//
// The Gradle project is rooted HERE, at the repository root, and the two Android modules
// live in android/<name>. That is what makes `gradle :android:loader:assembleRelease` - the
// invocation scripts/build_android.py uses - find them, and where their APKs land
// (android/<module>/build/outputs/apk/<variant>/).
//
// There is deliberately no `:android:shared` module: the loader and the manager both pull
// android/shared/src/main/java in with `sourceSets.main.java.srcDirs +=` (upstream's
// design, see android/README.md), so declaring a module for the same sources would compile
// them twice.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // Modules do not declare their own repositories: one list, here, so a dependency
    // cannot resolve in one module and not another.
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "hypercord"

include ':android:manager'
include ':android:loader'
