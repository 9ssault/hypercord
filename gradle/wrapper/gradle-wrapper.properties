# language: Properties, file: gradle/wrapper/gradle-wrapper.properties
#
# Gradle 8.11.1, the version that pairs with the Android Gradle Plugin pinned in
# `build.gradle` (AGP 8.9.0). Change one and change the other.
#
# There is no `gradle/wrapper/gradle-wrapper.jar` in this repository, and it cannot be
# written by hand - it is a compiled binary. So `./gradlew` does not run yet: it reports
# "Could not find or load main class org.gradle.wrapper.GradleWrapperMain". One command
# on a machine with Gradle installed creates it, and the jar, the `gradlew` scripts and
# this file should then be committed together:
#
#     gradle wrapper --gradle-version 8.11.1
#
# CI does not need it: GitHub's runners have Gradle, and the Android workflow runs
# `scripts/build_android.py`, which is expected to invoke whichever Gradle it finds -
# the wrapper when the jar is present, the `gradle` on the PATH otherwise.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
